<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
body{background:#0a0205;color:#e8d4b8;font-family:'Press Start 2P',monospace;margin:0;padding:26px}
.row{display:flex;align-items:center;gap:30px;padding:20px;border-bottom:1px solid #3a1218}
.name{width:150px;font-size:11px;color:#f5c842}
.big img{width:150px;height:150px;image-rendering:pixelated;border:2px solid #c8152a;border-radius:6px;background:#16060a}
.hdr{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#0d0204,#1a0408);border:1px solid #3a1218;padding:10px 14px;border-radius:5px}
.hdr img{width:44px;height:44px;image-rendering:pixelated;border:2px solid #c8152a;border-radius:5px}
.hdr span{font-size:10px;color:#f5c842;line-height:1.45}
.hdr span small{display:block;margin-top:3px;color:#e8833a;font-size:7px}
.fav{display:flex;align-items:center;gap:10px;background:#241016;padding:7px 12px;border-radius:4px}
.fav img{width:16px;height:16px;image-rendering:pixelated}
.fav b{font-size:8px;color:#a88972;font-weight:400}
</style></head><body>
<div class="row"><div class="name">A. HELMET</div><div class="big"><img src="logo-helmet.svg"></div>
<div class="hdr"><img src="logo-helmet.svg"><span>GLADIHOPPERS<small>FREE BROWSER GAMES</small></span></div>
<div class="fav"><img src="logo-helmet.svg"><b>gladihoppersgames.github.io</b></div></div>

<div class="row"><div class="name">B. SWORDS</div><div class="big"><img src="logo-swords.svg"></div>
<div class="hdr"><img src="logo-swords.svg"><span>GLADIHOPPERS<small>FREE BROWSER GAMES</small></span></div>
<div class="fav"><img src="logo-swords.svg"><b>gladihoppersgames.github.io</b></div></div>

<div class="row"><div class="name">C. MONOGRAM</div><div class="big"><img src="logo-monogram.svg"></div>
<div class="hdr"><img src="logo-monogram.svg"><span>GLADIHOPPERS<small>FREE BROWSER GAMES</small></span></div>
<div class="fav"><img src="logo-monogram.svg"><b>gladihoppersgames.github.io</b></div></div>
</body></html>
